name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest
          enable-cache: true

      - name: Install deps
        run: uv sync

      - name: Check formatting of shell scripts
        run: |
          git ls-files '*.sh' \
            | tee /dev/stderr \
            | xargs uv run shfmt --diff

      - name: Lint shell scripts
        run: |
          git ls-files '*.sh' \
            | tee /dev/stderr \
            | xargs uv run shellcheck

      - name: Check formatting of Python code
        run: uv run ruff format --check .

      - name: Lint Python code
        run: uv run ruff check .

      - name: Type check Python code
        run: uv run mypy --show-error-codes --pretty .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: local-test:no-publish
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          ./test/bats/bin/bats --verbose-run ./test
